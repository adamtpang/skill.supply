# repos.yaml v0 — see github.com/adamtpang/repo-protocol
repo: skill.supply
is: The supply side of talent: an AI career agent that packages a person and places them.
url: https://skill.supply
cluster: talent-stack
ranks: candidates

provides:
  - id: career-agent
    what: ikigai read, resume packaging, role matching
    at: lib/agent.ts
  - id: career-profile-contract
    what: local-first factual profile, evidence index, story bank, gaps, and approved application answers
    at: data/profiles/_template/profile.md
  - id: placement-campaign-contract
    what: five-target company campaign with sourced hypotheses, proof, drafts, and manual-action guardrails
    at: lib/campaign.ts
  - id: s-tier-target-contract
    what: the shared AND-gate definition for judging a company, team, role, offer, and location across problem, hiring budget, people, and place
    at: S_TIER_TARGET_SPEC.md

stack: [next, anthropic, zod]

kin:
  - repo: darktalent.tech
    why: darktalent.tech owns scoring, public signals, and the shared TalentProfile card; skill.supply owns demand discovery, matching, gap ETA, candidate campaigns, introductions, and placement. The card is scored by darktalent, transacted by skill.supply, and placement outcomes write back to calibrate the score.
  - repo: company.university
    why: consumes its in-demand-skills board as matching targets
  - repo: summon.company
    why: summon builds the company; skill.supply staffs it
  - repo: optimism.fun
    why: same legibility-engines ranking pattern (live public data -> a scored rank), same family as pokedex.life (people), portal.voyage (places), and moneymeta.fun (income paths). Both repos even use the same manifest convention, this file declares "ranks: candidates", optimism.fun declares "ranks: problems". the Skill Market Cap hourly demand ranking (now extracted to skillmarketcap.com) is a concrete real data source moneymeta.fun could eventually pull from for its AI-native decks, which currently have no verified income median. Added 2026-08-22: optimism.fun now declares this repo the JOIN half of its start-or-join starter packs. It supplies the ranked target list of S-tier companies worth joining (the $1T-ceiling set: Helion, Commonwealth Fusion, Fervo and peers); this repo's career agent packages the candidate for those specific roles. Its list, this repo's placement.
  - repo: youchop.app
    why: youchop.app's tools/corpus.mjs pulls real transcripts and channel corpora; skill.supply's research needs (verifying a claim against a real source instead of a search-snippet paraphrase, as done for the Naval Ravikant JRE #1309 check) can run through it instead of ad hoc web search
  - repo: moneymeta.fun
    why: moneymeta.fun already declares this kin edge (shares the fleet footer and the same audience, someone ranking income paths is the same person deciding which job to take), reciprocated here. Concretely, the Skill Market Cap hourly demand ranking (now extracted to skillmarketcap.com) is a real data source moneymeta.fun's AI-native income decks could pull from, since those decks currently have no verified income median.
  - repo: summon.guide
    why: summon.guide already declares this edge (skill.supply packages a person for hiring, its legends coach the decision, not just the resume), reciprocated here. Concretely, summon.guide's legend-match (src/app/api/match) routes a free-text question to the best-fit sourced figure, so a candidate weighing skill.supply's judged offers or ETA-gap tradeoffs can be handed to a real mentor chat instead of generic advice.
  - repo: vercel.school
    why: proof over pedigree needs a verifiable proof list; vercel.school's shipped-domains-inventory (index.html) is the public ground-truth of the candidate's live products, the exact list skill.supply's outreach cites as evidence, and skill.supply is itself one of the products on it.
  - repo: megawatt.fun
    why: megawatt.fun was born inside this repo's job search; it is the public demo surface for the dispatch-planner proof-of-work artifact (github.com/adamtpang/megawatt.fun) attached to the Base Power outreach.
  - repo: adampang.com
    why: adampang.com is the candidate's own proof layer, the visual tracker of the shipped output (apps, essays, songs) that this repo's proof-over-pedigree packaging cites as evidence; the transfer market and the personal hub point at the same artifacts.
  - repo: sprite.email
    why: this repo's job search stages fully drafted outreach emails; sprite.email's draft-loader (src/app/api/drafts/load/route.ts) turns them into real Gmail drafts, so previewing, improving, sending, or discarding each one happens natively in Gmail, and the sending stays Adam's act, never the agent's.
  - repo: themain.quest
    why: themain.quest surfaces the one move that matters most across Adam's whole life, and right now that move lives in this repo (Aether/GOAL.md names the S-tier income goal as the active quest; SEND_TODAY.md and X_CALENDAR.md are the daily move feeds). The macro quest dashboard and the quest's own engine room. In the who/what/where life map themain.quest hubs (Naval Ravikant's three big decisions: what you do, who you're with, where you live), this repo is a WHAT engine alongside optimism.fun, with pokedex.life as WHO and portal.voyage as WHERE.
  - repo: ness.city
    why: ECOSYSTEM.md's standing rule names NS members as supply-only, never sold to; ness.city is the civic layer for that community and hosts the Exam Course (/fellowship-prep) that grows it. Reciprocal of ness.city's own edge; the never-extract rule is the shared law.
  - repo: portal.voyage
    why: skill.supply judges the company, team, role, offer, and candidate match; portal.voyage owns the required-location axis through cost, field-specific career density, admired people, and hard visa, language, climate, and timezone filters. Under S_TIER_TARGET_SPEC.md, a target qualifies as S-tier only when problem, hiring budget, people, and place all pass, so WHAT and WHERE are one decision rather than separate rankings.
  - repo: skillmarketcap.com
    why: the Skill Market Cap demand ranking was extracted from this repo's /skills route into its own repo and domain on 2026-08-15 (that route now redirects there). skill.supply is the supply side, packaging and placing a person; skillmarketcap.com is the demand side, measuring what the market asks for. lib/companies.ts and lib/jobs.ts are duplicated across both on purpose, per its HANDOFF_FROM_SKILL_SUPPLY.md.
  - repo: sellsniper.com
    why: this repo's job search kept hitting the same wall, proof-over-pedigree only works when the proof is visible, and the candidate's proof is 53 public repos carrying 5 stars total (verified against the GitHub API 2026-08-23). Finding the right communities for an artifact is sellsniper's whole job description, so on 2026-08-23 that work was handed over as sellsniper.com/HANDOFF_FROM_SKILL_SUPPLY.md plus GITHUB_DISTRIBUTION.md. This repo keeps the outreach half (X_DM_HIRING.md, DMing people posting hiring on X); sellsniper keeps the artifact-distribution half. Same underlying problem, REACH, split at the seam between a person and a repo.
  - repo: deathmoney.fyi
    why: deathmoney.fyi supplies the private burn, debt, accessible-cash, and runway constraints that should govern this career agent's priorities; skill.supply turns the resulting urgency into qualified income opportunities and records job income as an outcome. Together they separate the immediate stabilization job from the longer ownership path without publishing private financial data.

canon: ECOSYSTEM.md (the Talent Trifecta constitution, identical in all three repos)
